<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Služby MP Blansko – verze pro počítač</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ch-left:232px;
  --bg:#E6E9E3; --sheet:#FAFAF7; --ink:#1E2A4A; --ink2:#4D5670; --line:#DDE1E7;
  --day:#F2D24A; --dayBg:#FAEFB8; --dayBd:#D9BE3A; --dayInk:#5C5420;
  --night:#4B3F9E; --nightBg:#3B3486; --nightInk:#C9C4F2;
  --green:#2E7D4F; --red:#B83A3A; --redL:#D04848; --blue:#1E63C6; --pd:#3A9AD9;
  --absBg:#F6D2D2; --absInk:#8A2E2E;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:Barlow,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 2px var(--sheet),0 0 0 5px var(--blue)}
h1,h2,h3{font-family:var(--f-cond);font-weight:700;margin:0;line-height:1.05}
[hidden]{display:none!important}

/* přihlášení */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{width:min(420px,100%);background:var(--sheet);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(30,42,74,.12)}
.gate h1{font-size:36px}
.gate p{margin:0;color:var(--ink2)}
.gate label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.gate input{min-height:44px;border-radius:10px;border:1.5px solid var(--ink);padding:0 12px;background:#fff}
.msg{font-size:14px;min-height:1em}
.msg.err{color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:14px;align-self:flex-start}

/* rozvržení */
.app{display:flex;min-height:100vh}
.nav{flex:0 0 232px;--ch-left:232px;background:var(--ink);color:#EEF0F4;padding:26px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}
.brand b{display:block;font-family:var(--f-cond);font-size:28px;line-height:1}
.brand span{font-size:13px;color:#AEB6CC}
.nav .items{display:flex;flex-direction:column;gap:4px}
.nav .item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#EEF0F4;text-align:left;font-weight:500}
.nav .item:hover{background:#2C3A5E}
.nav .item[aria-current="page"]{background:var(--day);color:var(--ink);font-weight:700}
.nav .item svg{flex:none}
.nav .badge{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--redL);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #3A4766;display:flex;flex-direction:column;gap:10px}
.nav .foot b{font-weight:600}
.nav .foot .row{display:flex;gap:8px;flex-wrap:wrap}
.nav .foot button,.nav .foot a{min-height:36px;padding:0 12px;border-radius:8px;border:1.5px solid #6B789A;background:transparent;color:#EEF0F4;font-size:14px;display:inline-flex;align-items:center;text-decoration:none}
.main{flex:1;min-width:0;padding:24px 28px 40px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.bar h1{font-size:38px;margin-right:6px}
.sq{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);font-size:22px;line-height:1}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 18px;border:0;background:var(--sheet);font-weight:600}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.push{margin-left:auto}
.lbl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.lbl select{min-height:40px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);padding:0 10px}
.status{font-size:14px;color:var(--ink2)}
.panel{background:var(--sheet);border-radius:14px;padding:18px}
.panel h2{font-size:22px;margin-bottom:10px}
.empty{color:var(--ink2);font-size:14px;margin:0}

/* týden */
.planwrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.week{flex:999 1 740px;min-width:0;overflow-x:auto;padding:8px;margin:-8px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.dhead{height:64px;border-radius:12px;background:var(--sheet);border:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dhead .w{font-family:var(--f-cond);font-weight:600;font-size:16px;line-height:1}
.dhead .d{font-family:var(--f-cond);font-weight:700;font-size:28px;line-height:1.05}
.dhead.today{background:var(--dayBg);border:2.5px solid var(--blue)}
.dhead.we .w{color:#8A5A1E}
.ev{min-height:18px;font-size:13px;font-weight:600;color:#A33A3A;text-align:center;line-height:1.2}
.card{border-radius:12px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px}
.card.day{background:var(--dayBg);border:3px solid var(--dayBd);min-height:210px}
.card.night{background:var(--nightBg);color:#F2F0FF;border:3px solid var(--nightBg);min-height:140px}
.card.empty{opacity:.55}
.card.mine{border-color:var(--ink)}
.card.night.mine{border-color:#F2D24A}
.card.live{border-color:var(--blue)}
.card.night.live{border-color:#8FB2FF}
.ch{display:flex;justify-content:space-between;align-items:baseline}
.ch b{font-family:var(--f-cond);font-size:17px}
.ch span{font-family:var(--f-cond);font-weight:600;font-size:15px;color:var(--dayInk)}
.card.night .ch span{color:var(--nightInk)}
.prog{height:6px;border-radius:3px;background:rgba(0,0,0,.12)}
.prog i{display:block;height:6px;border-radius:3px;background:var(--blue)}
.card.night .prog{background:rgba(255,255,255,.2)}
.card.night .prog i{background:#8FB2FF}
.st{align-self:flex-start;padding:3px 8px;border-radius:6px;background:var(--green);color:#fff;font-weight:600;font-size:13px}
.p{font-size:14px;line-height:1.3}
.p.me{font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.sw{display:inline-block;margin-left:4px;padding:0 4px;border:1px dashed currentColor;border-radius:4px;font-size:11px;opacity:.85}
.abs{margin-top:auto;padding-top:6px;border-top:1px dashed #C9B45A;font-size:12px;line-height:1.3;color:var(--dayInk)}
.card .swapbtn{margin-top:6px;align-self:flex-start;min-height:30px;padding:0 10px;border-radius:8px;border:1.5px solid currentColor;background:transparent;font-size:13px;font-weight:600}

/* pravý panel */
.rail{flex:1 1 280px;max-width:100%;display:flex;flex-direction:column;gap:16px}
.live-box{border:2.5px solid var(--blue)}
.live-box .k{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:700;font-size:14px}
.live-box .k i{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.big{font-family:var(--f-cond);font-weight:700;font-size:44px;line-height:1}
.big sup{font-size:20px}
.pr{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;color:var(--ink2)}
.pr b{color:var(--ink)}
.req{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.req:first-of-type{border-top:0;padding-top:0}
.req p{margin:0;line-height:1.4}
.req .pz{font-size:14px;color:var(--ink2);font-style:italic}
.req .meta{font-size:13px;color:var(--ink2)}
.req[data-id]{cursor:pointer}
.req .go{font-size:13px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.col.flash .dhead,.col.flash .card{animation:flash 1.6s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--redL)}100%{box-shadow:0 0 0 4px transparent}}
.req .btns{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-radius:10px;border:1.5px solid var(--dayBd);background:var(--dayBg);font-weight:600;text-align:left}
.opt.n{background:var(--nightBg);border-color:var(--nightBg);color:#fff}
.opt span{font-weight:500;font-size:13px}
.checks p{margin:4px 0;font-size:14px;line-height:1.35}
.checks .e{color:var(--red)}
.checks .w{color:#9A5B0E}
.checks .i{color:var(--ink2)}
.next{display:flex;align-items:center;gap:10px;min-height:36px;border-bottom:1px solid var(--line)}
.next i{width:12px;height:12px;border-radius:3px;flex:none}
.next span{flex:1}
.next b{font-family:var(--f-cond);font-weight:600;color:var(--ink2)}
.stbadge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:#E7E9EE;color:var(--ink2);margin-left:6px}

.card[data-det]{cursor:pointer;transition:transform .1s}
.card[data-det]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue),0 10px 24px rgba(30,99,198,.35);transform:translateY(-3px);position:relative;z-index:2}
.card.day[data-det]:focus{background:#FFE27A}
.card.night[data-det]:focus{background:#5B4FD0;border-color:#BFD2FF;box-shadow:0 0 0 3px #BFD2FF,0 10px 24px rgba(30,99,198,.45)}
.mc[data-det]:focus{outline:3px solid var(--blue);outline-offset:1px;transform:scale(1.18);position:relative;z-index:2;box-shadow:0 4px 12px rgba(30,99,198,.4)}
.bar .wk{font-family:var(--f-cond);font-weight:600;font-size:22px;color:var(--ink2);margin-right:auto}
.kbd-hint{font-size:12px;color:var(--ink2)}
.card[data-det]:hover{transform:translateY(-2px)}
.mc[data-det]{cursor:pointer}
.mc[data-det]:hover{outline:2px solid var(--ink);outline-offset:1px}
.det{position:fixed;inset:0;z-index:50;background:rgba(20,26,44,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.det-box:focus{outline:none}
.det-box{width:min(520px,100%);max-height:calc(100vh - 48px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.det-card{border-radius:18px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.det-card.day{background:var(--dayBg);border:2px solid var(--dayBd)}
.det-card.night{background:var(--nightBg);color:#F2F0FF}
.det-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.det-top h2{font-size:30px}
.det-live{display:inline-block;margin-top:4px;color:var(--blue);font-weight:700;font-size:14px}
.det-card.night .det-live{color:#8FB2FF}
.det-date{text-align:right;font-family:var(--f-cond);font-weight:700;line-height:1}
.det-date span{display:block;font-size:22px;opacity:.75}
.det-date b{font-size:40px;opacity:.75}
.det-card .big{margin-top:8px}
.det-card .pr{color:inherit;opacity:.85}
.det-lbl{margin:16px 0 6px;font-size:14px;opacity:.7}
.det-st{font-size:17px;padding:5px 12px}
.det-hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:18px}
.det-hl li::before{content:"– ";opacity:.6}
.det-hl li.me{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.det-extra{margin-top:16px;padding-top:12px;border-top:1px dashed currentColor;font-size:15px;line-height:1.4;opacity:.9}
.det-extra p{margin:0 0 4px}
.det-extra .dev{font-weight:600}
.cal-card{background:var(--sheet);border:2px solid var(--ink)}
.cal-who{font-size:14px;color:var(--ink2);font-weight:600}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.mc-top h2{font-size:30px}
.cal-sum{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:14px;color:var(--ink2)}
.cal-sum span{display:inline-flex;align-items:center;gap:6px}
.cal-sum b{color:var(--ink)}
.cal-sum i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cal-card .cd{height:56px}
.cal-card .cd:not(:disabled):hover{outline:2px solid var(--ink);outline-offset:1px}
.det-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.det-btns .btn.sec{background:var(--sheet)}

/* můj plán */
.mineview{flex:999 1 740px;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.pw{text-align:center;font-family:var(--f-cond);font-weight:600;font-size:16px;color:var(--ink2);padding-bottom:2px}
.pw.we{color:#8A5A1E}
.pc{min-height:112px;border-radius:12px;background:var(--sheet);border:2px solid transparent;padding:8px 9px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:transform .1s;position:relative}
.pc.blank{background:transparent;cursor:default}
.pc.we:not(.has){background:#F1EDE3}
.pc.past{opacity:.6}
.pc:not(.blank):hover{border-color:var(--ink)}
.pc.has.D{background:var(--dayBg);border-color:var(--dayBd)}
.pc.has.N{background:var(--nightBg);color:#F2F0FF;border-color:var(--nightBg)}
.pc.has.P{background:#D6EBF8;border-color:var(--pd)}
.pc.has.A{background:var(--absBg);border-color:#E7B3B3}
.pc.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.pc:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue),0 10px 24px rgba(30,99,198,.35);transform:translateY(-3px);opacity:1;z-index:2}
.pc.has.D:focus{background:#FFE27A}
.pc.has.N:focus{background:#5B4FD0;border-color:#BFD2FF;box-shadow:0 0 0 3px #BFD2FF,0 10px 24px rgba(30,99,198,.45)}
.pc-h{display:flex;align-items:baseline;justify-content:space-between}
.pc-h b{font-family:var(--f-cond);font-size:24px;line-height:1}
.pc-h .tod{font-size:12px;font-weight:700;color:var(--blue)}
.pc.N .pc-h .tod{color:#BFD2FF}
.chip{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;line-height:1.25}
.chip b{font-family:var(--f-cond);font-size:16px}
.chip i{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
.chip .stb{background:var(--green);color:#fff}
.chip .swb{border:1px dashed currentColor;font-weight:600}
.pteam{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;line-height:1.3;margin-top:2px}
.pteam small{font-weight:700;opacity:.8}
.pteam .pst{background:var(--green);color:#fff;font-weight:600;padding:0 5px;border-radius:4px}
.pteam .me{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.pteam .swb{font-style:normal;font-size:10.5px;border:1px dashed currentColor;border-radius:4px;padding:0 3px}
.pmeta{font-size:11.5px;line-height:1.25;opacity:.8}
.pnote{font-size:12px;line-height:1.3;background:rgba(224,124,124,.22);border-left:3px solid #E07C7C;border-radius:4px;padding:3px 6px}
.pc.N .pnote{background:rgba(255,255,255,.14)}
.det-notes{background:var(--sheet);border-radius:14px;padding:14px 16px;border-left:5px solid #E07C7C;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.dn-h{font-weight:700;color:#A33A3A}
.dn-h span{font-weight:500;color:var(--ink2);font-size:13px}
.dn{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px dashed #E7B3B3}
.dn:first-of-type{border-top:0;padding-top:0}
.dn p{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.4}
.dn-b{display:flex;gap:8px;justify-content:flex-end}
.dn textarea{font-size:16px}
.pev{margin-top:auto;font-size:12px;font-weight:600;color:#A33A3A;line-height:1.2}
.pc.N .pev{color:#FFC2C2}
.msum{display:flex;gap:10px}
.msum div{flex:1;border-radius:10px;background:#EEF0F4;padding:8px 10px;display:flex;flex-direction:column}
.msum b{font-family:var(--f-cond);font-size:30px;line-height:1}
.msum span{font-size:13px;color:var(--ink2)}
button.next.lnk{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;padding:0 4px}
button.next.lnk:hover{background:#EEF0F4}

/* měsíc */
.matrix{background:var(--sheet);border-radius:14px;padding:14px;overflow-x:auto}
.mgrid{display:grid;gap:3px;font-size:12px;min-width:1040px}
.mh{text-align:center;padding:4px 0;border-radius:6px;line-height:1.1}
.mh b{display:block;font-family:var(--f-cond);font-size:16px}
.mh span{color:var(--ink2)}
.mh.we{background:#EEE6D6}
.mh.today{background:var(--blue);color:#fff}
.mh.today span{color:#E2EAFF}
.mn{display:flex;align-items:center;padding:0 6px;border-radius:6px;font-size:13px;font-weight:500;min-height:32px;white-space:nowrap}
.mn.me{background:var(--day);font-weight:700}
button.mn{border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
button.mn:hover{background:#EEF0F4}
button.mn.me{background:var(--day)}
.mt.me{background:var(--day)}
.mc.hl{box-shadow:inset 0 0 0 2px var(--ink)}
.mc.hl:not(.D):not(.N):not(.P):not(.A){background:#FBEFB8}
.mc{position:relative;min-height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--f-cond);font-weight:600;font-size:12px;background:#EEF0F2;color:#9AA1B0}
.mc.D{background:var(--day);color:var(--ink)}
.mc.N{background:var(--night);color:#fff}
.mc.P{background:var(--pd);color:#fff}
.mc.A{background:var(--absBg);color:var(--absInk)}
.mc.today{box-shadow:inset 0 0 0 2px var(--blue)}
.mc.swp{box-shadow:inset 0 0 0 2px var(--red)}
.mc .s{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 1.5px #fff}
.mt{display:flex;align-items:center;justify-content:center;font-family:var(--f-cond);font-weight:600;font-size:15px;border-radius:6px}
.mev{font-size:11px;line-height:1.15;color:#A33A3A;font-weight:600;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);min-height:56px;display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.legend{align-items:center}
.lgf{display:flex;align-items:center;gap:6px;font:inherit;color:inherit;background:transparent;border:1.5px solid transparent;border-radius:8px;padding:4px 9px;margin:-5px -4px;cursor:pointer}
.lgf:hover{border-color:var(--line,#D5D9E0)}
.lgf:not(.on){opacity:.4;text-decoration:line-through}
.lgf:not(.on) i{box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.lgf.all{opacity:1;text-decoration:none;border-color:var(--ink);font-weight:600;color:var(--ink)}
.mc.off{background:#EEF0F2 !important;color:transparent !important;box-shadow:none}
.mc.off .s{display:none}

/* kalendáře (výměna, volno) */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dw{text-align:center;font-size:13px;color:var(--ink2)}
.cd{position:relative;height:50px;border-radius:9px;border:0;background:#E7E9EE;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-cond);padding:0}
.cd b{font-weight:700;font-size:19px}
.cd small{font-weight:600;font-size:12px}
.cd.D{background:var(--day)}
.cd.N{background:var(--night);color:#fff}
.cd.P{background:var(--pd);color:#fff}
.cd.A{background:var(--absBg);color:var(--absInk)}
.cd.blank{background:transparent}
.cd.dim{opacity:.4}
.cd.give{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--redL)}
.cd.pick{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}
.cd.daypick{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--blue)}
.cd.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cd .s{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 1.5px #fff}
.cd .v{position:absolute;top:3px;right:6px;font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--red)}
.cd.vsel{box-shadow:inset 0 0 0 3px var(--redL)}
.cd.vsel:not(.D):not(.N){background:#F9D3D3}
.cd.vsaved:not(.vsel){box-shadow:inset 0 0 0 3px #E8A3A3}
.cd.vsaved:not(.vsel):not(.D):not(.N){background:#FBE6E6}
.cd.vsaved:not(.vsel) .v{color:#C76A6A}
.cd.N .v{color:#FFC9C9}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>.panel{flex:1 1 340px}
.hint{font-size:14px;color:var(--ink2);margin:0}
.people{display:flex;flex-direction:column;gap:6px}
.person{min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;text-align:left;font-weight:600}
.person.D{border-left:6px solid var(--day)}
.person.N{border-left:6px solid var(--night)}
.person[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.person span{font-weight:500;font-size:13px}
.sum{border:2.5px dashed var(--redL);border-radius:14px;padding:16px 18px;background:#FFF8F6;color:#1E50A8;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.45}
.sum h2{color:var(--ink)}
.sum p{margin:0}
.redhead{color:var(--red)}
.redhead .k{font-family:var(--f-cond);font-weight:600;font-size:22px}
.redhead h1{font-size:44px}
textarea{width:100%;border-radius:10px;border:1.5px solid var(--ink);background:#fff;padding:10px 12px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;font-size:15px}
.field select{min-height:46px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;padding:0 12px;font-size:16px}

/* volno */
.vitem{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:#F8E1E1}
.vitem.edit{outline:2px solid var(--redL)}
.vitem .body{flex:1;text-align:left;border:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}
.vitem .g+.g{border-top:1px dashed #D9A0A0;padding-top:6px}
.vitem .g b{font-size:16px}
.vitem .tot{border-top:1.5px solid #D08A8A;padding-top:6px;font-weight:700}
.vitem .copy{flex:none;width:44px;height:44px;border-radius:10px;border:1.5px solid #E07C7C;background:#fff;color:#A33A3A;display:flex;align-items:center;justify-content:center}
.ytot{padding:16px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--sheet)}
.ytot div:first-child{font-size:14px;color:var(--ink2);font-weight:600}
.ytot .big{font-size:40px}

@media (max-width:900px){
  .app{flex-direction:column}
  .nav{position:static;height:auto;flex:none}
  .nav .foot{margin-top:0}
}
@media print{
  .nav,.bar .sq,.bar .seg,.bar .btn,.bar .lbl,.rail{display:none!important}
  body{background:#fff}
  .main{padding:0}
}

<body>

<div class="gate" id="gate" hidden>
  <form id="loginForm" novalidate>
    <h1>Služby MP Blansko</h1>
    <p>Verze pro počítač. Přihlas se stejným účtem jako do RZ Scanneru.</p>
    <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
    <label>Heslo<input type="password" id="pass" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Přihlásit</button>
    <button class="linkbtn" type="button" id="resetBtn">Zapomenuté heslo</button>

    <a class="linkbtn" href="index.html">Mobilní verze</a>

<div class="app" id="app" hidden>
  <nav class="nav" aria-label="Hlavní navigace">
    <div class="brand"><b>Služby</b><span>Městská policie Blansko</span></div>
    <div class="items">
      <button class="item" type="button" data-view="plan" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Plán služeb</button>
      <button class="item" type="button" data-view="vymeny">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>
        Výměny služeb<span class="badge" id="navBadge" hidden>0</span></button>
      <button class="item" type="button" id="navChat" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg>
        Chat<span class="badge" id="chatBadge" hidden>0</span></button>
      <button class="item" type="button" data-view="volno" id="navVolno">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
        Plánování volna</button>
      <button class="item" type="button" data-view="admin" id="navAdmin" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        Administrace</button>
    </div>
    <div class="foot">
      <b id="whoName"></b>

        <a href="index.html">Mobilní verze</a>

      </div>
      <span style="font-size:12px;color:#8C96B2" id="deskVer">desktop v3.2</span>

  </nav>
  <main class="main" id="main"></main>
  <div class="det" id="det" role="dialog" aria-modal="true" aria-label="Detail služby" hidden><div class="det-box" id="detBody" tabindex="-1"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>

<script>
// pojistka: kdyby se načetlo starší jádro bez přítomnosti uživatelů, stránka se nesmí zaseknout
if (typeof PRES_CSS === "undefined") window.PRES_CSS = "";
if (typeof presenceStart === "undefined") window.presenceStart = null;
if (typeof presenceHTML === "undefined") window.presenceHTML = () => `<p>Přehled uživatelů potřebuje aktuální soubor sluzby-core.js.</p>`;
if (typeof ONLINE_COL === "undefined") window.ONLINE_COL = "online";
if (typeof ONLINE_MS === "undefined") window.ONLINE_MS = 180000;
if (typeof zaTvar === "undefined") window.zaTvar = n => String(n).split(" ")[0];
</script>
<script>
/* =====================================================================
   Služby MP Blansko – verze pro počítač
   Data, přihlášení a pravidla jsou společné s mobilní verzí (index.html);
   výpočty a kontroly bere ze sluzby-core.js.
   ===================================================================== */
const SWAP_COL = "vymeny";
const ADMINS = ["juracka.1048@rzscanner.cz"]; // jen zobrazení – oprávnění hlídají pravidla Firestore
const DESK_VER = "desktop v3.2";
const isAdmin = () => ADMINS.includes(SELF_EMAIL);
let PRES = null, ONLINE = {}, unsubOnline = null;
let ADM = {tab:"zmeny", y:0, m:0, typ:"prevzeti", from:"", fromShift:null, to:"", toShift:null, pozn:""};
document.head.insertAdjacentHTML("beforeend", `<style>${PRES_CSS}</style>`);
const qNow = new URLSearchParams(location.search).get("now");
const getNow = () => qNow ? new Date(qNow) : new Date();
const $ = id => document.getElementById(id);
const MAIN = $("main");
const NTIME = {N12:"19–7", N13:"19–8", Nz7:"19–24"};
const MONTHS_GEN = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];

let auth = null, db = null;
let SELF = null, SELF_NO = null, SELF_EMAIL = "", OFFICERS = {}, ME = "";
let PENDING = [], MY_OD = [], MY_ZA = [], MY_VOLP = [], MY_SNOTES = {};
// poznámky ke službě – stejný záznam jako v mobilu: poznamky/{číslo}.sluzby["RRRR-MM-DD|D/N"] = [texty]
const snKey = (y, m, d, k) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}|${k}`;
const snotesOf = key => { const v = MY_SNOTES[key]; return Array.isArray(v) ? v.filter(Boolean) : v ? [String(v)] : []; };
async function writeSnotes(key, list){
  const FV = firebase.firestore.FieldValue;
  await db.collection("poznamky").doc(SELF_NO).set(list.length ? {sluzby:{[key]:list}, upraveno:FV.serverTimestamp()} : {sluzby:{[key]:FV.delete()}}, {merge:true});
}
const M = {};          // měsíce: id → {plan, ev, swaps, T, notes, len, okP, okS}
const unsubs = [];
let VIEW = "plan", PMODE = "week", WEEK = null, MY_ = {y:0, m:0};
let SW = null;         // rozpracovaná nová žádost
let PROP = null;       // rozpracovaný návrh {id, picks}
let VOL = {y:0, m:0, draft:new Set(), edit:null};

/* ---------- pomocné ---------- */
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const idOf = d => docId(d.getFullYear(), d.getMonth());
const shortName = n => { const p = String(n).split(" "); return p.length > 1 ? p[0] + " " + p[1][0] + "." : n; };
function windowOf(date, code){
  const c = CODES[code]; if (!c || !c.s) return [date, date];
  const s = new Date(date.getFullYear(), date.getMonth(), date.getDate(), c.s[0], c.s[1]);
  let e = new Date(date.getFullYear(), date.getMonth(), date.getDate(), c.e[0], c.e[1]);
  if (e <= s) e = new Date(e.getTime() + 864e5);
  return [s, e];
}
const durTxt = ms => { const m = Math.max(0, Math.round(ms / 6e4)); return `${Math.floor(m / 60)} h ${m % 60} min`; };
const sup = h => `${h}<sup>00</sup>`;
const tokens = (T, name, d) => ((T[name] || [])[d - 1] || ".").split("+");

/* ---------- Firebase ---------- */
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey && cfg.apiKey !== "DOPLNIT"){
  firebase.initializeApp(cfg);
  auth = firebase.auth(); auth.languageCode = "cs";
  db = firebase.firestore();
  auth.onAuthStateChanged(u => u ? start() : stop());
} else {
  $("gate").hidden = false; $("loginMsg").textContent = "Chybí nastavení Firebase (firebase-config.js).";
}
const loginMsg = (t, err) => { $("loginMsg").textContent = t; $("loginMsg").className = "msg" + (err ? " err" : ""); };
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  try { loginMsg("Přihlašuji…"); await auth.signInWithEmailAndPassword($("email").value.trim(), $("pass").value); }
  catch (err){ loginMsg(err.code === "auth/too-many-requests" ? "Příliš mnoho pokusů, zkus to za chvíli." : "Špatný e-mail nebo heslo.", true); }
});
$("resetBtn").addEventListener("click", async () => {
  const em = $("email").value.trim(); if (!em){ loginMsg("Vyplň nejdřív e-mail.", true); return; }
  try { await auth.sendPasswordResetEmail(em); loginMsg("Odkaz na změnu hesla je odeslaný na e-mail."); }
  catch (err){ loginMsg("Odkaz se nepodařilo odeslat.", true); }
});
$("logout").addEventListener("click", async () => { if (PRES){ await PRES.logout(); PRES = null; } auth.signOut(); });

function start(){
  $("gate").hidden = true; $("app").hidden = false;
  SELF_EMAIL = auth.currentUser.email || "";
  const parts = SELF_EMAIL.split("@")[0].split(".");
  SELF_NO = parts.length > 1 ? parts[1] : null;
  const now = getNow();
  WEEK = mondayOf(now); MY_ = {y:now.getFullYear(), m:now.getMonth()};
  ADM.y = now.getFullYear(); ADM.m = now.getMonth();
  $("navAdmin").hidden = !isAdmin();
  if (SELF_NO && !PRES && presenceStart) PRES = presenceStart({db, firebase, cislo:SELF_NO, email:SELF_EMAIL, jmeno:() => SELF, typ:"desktop", verze:DESK_VER});
  unsubs.push(db.collection(COLLECTION).doc("straznici").onSnapshot(s => {
    OFFICERS = (s.exists && s.data().cisla) || {};
    SELF = SELF_NO ? (Object.keys(OFFICERS).find(n => String(OFFICERS[n]) === SELF_NO) || null) : null;
    if (!ME) ME = SELF || "";
    $("whoName").textContent = SELF || SELF_EMAIL;
    $("navVolno").hidden = !(SELF && DLP_ANY(SELF));
    if (PRES && SELF && !PRES.named){ PRES.named = true; PRES.beat(); }
    chatStart();
    render();
  }, () => {}));
  unsubs.push(db.collection(SWAP_COL).where("stav", "in", ["ceka", "navrh"]).onSnapshot(s => {
    PENDING = s.docs.map(d => ({id:d.id, ...d.data()})); updateBadge(); render();
  }, () => {}));
  if (SELF_NO){
    const col = db.collection(SWAP_COL);
    unsubs.push(col.where("odCislo", "==", SELF_NO).where("stav", "==", "prijato").onSnapshot(s => { MY_OD = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {}));
    unsubs.push(col.where("zaCislo", "==", SELF_NO).where("stav", "==", "prijato").onSnapshot(s => { MY_ZA = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {}));
    unsubs.push(db.collection("poznamky").doc(SELF_NO).onSnapshot(s => { const dd = s.exists ? s.data() : {}; MY_VOLP = volLoad(dd); MY_SNOTES = dd.sluzby || {}; render(); }, () => {}));
  }
  render();  if (OPEN_REQ && OPEN_REQ !== "chat") openFromPush(OPEN_REQ);
}
/* chat (modul sluzby-chat.js) */
function chatStart(){
  if (!window.SluzbyChat || !SELF_NO) return;
  SluzbyChat.init({db, firebase, me:SELF_NO, meName:() => SELF || SELF_EMAIL, officers:() => OFFICERS, isAdmin:isAdmin(), now:getNow, desk:true,
    onAllowed: ok => { $("navChat").hidden = !ok; },
    onBadge: n => { const b = $("chatBadge"); b.hidden = !n; b.textContent = n > 99 ? "99+" : n; },
    onAdminChange: () => { if (VIEW === "admin" && ADM.tab === "uziv") render(); }});
  if (OPEN_REQ === "chat") openFromPush("chat", OPEN_T);
}
$("navChat").addEventListener("click", () => { if (window.SluzbyChat) SluzbyChat.open(); });
function stop(){
  if (window.SluzbyChat) SluzbyChat.stop();
  $("navChat").hidden = true;
  if (PRES){ PRES.stop(); PRES = null; }
  if (unsubOnline){ unsubOnline(); unsubOnline = null; }
  unsubs.splice(0).forEach(u => { try { u(); } catch (e){} });
  for (const k of Object.keys(M)){ M[k].unsub && M[k].unsub.forEach(u => u()); delete M[k]; }
  SELF = SELF_NO = null; ME = ""; PENDING = []; MY_OD = []; MY_ZA = []; MY_VOLP = [];
  $("app").hidden = true; $("gate").hidden = false; loginMsg("");
}

/* ---------- měsíce (plán + výměny → efektivní plán) ---------- */
function month(id){
  if (M[id]) return M[id];
  const [y, m] = ymOf(id);
  const o = M[id] = {id, y, m, len:new Date(y, m + 1, 0).getDate(), plan:null, ev:{}, swaps:[], T:{}, notes:{}, okP:false, okS:false, exists:false, unsub:[]};
  const recalc = () => { if (!o.okP) return; const r = applySwaps(o.plan || {}, o.swaps, o.len); o.T = r.T; o.notes = r.notes; render(); };
  o.unsub.push(db.collection(COLLECTION).doc(id).onSnapshot(s => {
    o.exists = s.exists; const d = s.exists ? s.data() : {};
    o.plan = d.plan || {}; o.ev = d.udalosti || {}; o.okP = true; recalc();
  }, () => { o.okP = true; render(); }));
  o.unsub.push(db.collection(SWAP_COL).where("mesic", "==", id).onSnapshot(s => {
    o.swaps = s.docs.map(d => ({id:d.id, ...d.data()})); o.okS = true; recalc();
  }, () => {}));
  return o;
}
function dayInfo(date){
  const o = month(idOf(date)); if (!o.okP) return null;
  const d = date.getDate(), D = {stala:null, hl:[]}, N = {stala:null, hl:[]}, P = [], A = {};
  let nk = "";
  for (const [name, arr] of Object.entries(o.T)){
    ((arr[d - 1]) || ".").split("+").forEach(c => {
      if (c === ".") return;
      const st = c.endsWith("*"), code = st ? c.slice(0, -1) : c, def = CODES[code]; if (!def) return;
      const p = {name, code, note:o.notes[`${d}|${def.k}|${name}`] || ""};
      if (def.k === "D" || def.k === "N"){ if (st) (def.k === "D" ? D : N).stala = p; else (def.k === "D" ? D : N).hl.push(p); if (def.k === "N" && (st || !nk)) nk = code; }
      else if (def.k === "P") P.push(p);
      else if (def.k === "A") (A[code] ||= []).push(name);
    });
  }
  const cmp = (a, b) => a.name.localeCompare(b.name, "cs");
  D.hl.sort(cmp); N.hl.sort(cmp); P.sort(cmp);
  return {date, D, N, P, A, ev:o.ev[d] || o.ev[String(d)] || "", nk:nk || "N13", exists:o.exists};
}
function myShifts(fromDate, days){
  // moje služby od data na zadaný počet dní (přes hranici měsíce)
  const out = [];
  for (let i = 0; i < days; i++){
    const dt = addDays(fromDate, i), o = month(idOf(dt)); if (!o.okP || !SELF) continue;
    tokens(o.T, SELF, dt.getDate()).forEach(c => {
      const code = c.replace(/\*$/, ""), def = CODES[code];
      if (!def || !def.s || def.k === "K") return;
      const [s, e] = windowOf(dt, code);
      out.push({date:dt, code, kind:def.k, st:c.endsWith("*"), s, e});
    });
  }
  return out.sort((a, b) => a.s - b.s);
}

/* ---------- žádosti ---------- */
const incoming = () => PENDING.filter(r => SELF_NO && (
  (r.stav === "ceka" && r.zaCislo === SELF_NO) ||
  (r.stav === "navrh" && r.odCislo === SELF_NO)));
const offers = () => PENDING.filter(r => SELF_NO && r.stav === "ceka" && r.zaCislo == null && r.odCislo !== SELF_NO);
const mineOut = () => PENDING.filter(r => SELF_NO && r.odCislo === SELF_NO && r.stav === "ceka");
function updateBadge(){ const n = incoming().length; $("navBadge").textContent = n; $("navBadge").hidden = !n; }
function reqText(r){
  const od = r.od, za = r.za || {};
  if (r.typ === "vymena" && r.moznosti && !za.den) return `<b>${esc(od.jmeno)}</b> dá svou ${fmtS(r.mesic, od)} za ${za.jmeno === SELF ? "jednu z tvých služeb" : `jednu ze služeb <b>${esc(za.jmeno)}</b>`}: ${r.moznosti.map(t => fmtS(r.mesic, parseProp(t))).join(", ")}.`;
  if (r.typ === "vymena") return `<b>${esc(od.jmeno)}</b> dá svou ${fmtS(r.mesic, od)} za ${za.jmeno === SELF ? "tvoji" : `službu <b>${esc(za.jmeno)}</b>`} ${fmtS(r.mesic, za)}.`;

const ST_LBL = {ceka:"Čeká", navrh:"Návrh", prijato:"Přijato", odmitnuto:"Odmítnuto", zruseno:"Zrušeno"};

  if (r.stav === "ceka" && r.odCislo === SELF_NO) return `<div class="btns"><button type="button" class="btn sec sm" data-act="cancel">Zrušit žádost</button></div>`;

}
function reqCard(r, withActions){
  return `<div class="req" data-id="${r.id}"><p>${reqText(r)} <span class="stbadge">${ST_LBL[r.stav] || ""}</span></p>${r.pozn ? `<p class="pz">„${esc(r.pozn)}“</p>` : ""}${r.skupina && r.skupina.length > 1 && r.stav === "ceka" ? `<p class="meta">Žádost dostalo ${r.skupina.length} kolegů – platí, kdo přijme první.</p>` : ""}${withActions ? reqActions(r) : ""}<div class="checks msg"></div><span class="go">Zobrazit v plánu ›</span></div>`;
}
function propHTML(r){
  const [y, m] = ymOf(r.mesic), o = month(r.mesic), now = getNow(), picks = PROP.picks;
  const requested = new Set([(r.za && r.za.den) ? `${r.za.den}|${r.za.kind}` : "", ...(r.moznosti || []).map(t => { const x = parseProp(t); return `${x.den}|${x.kind}`; })]);
  const btns = [];
  (o.T[SELF] || []).forEach((tok, i) => tok.split("+").forEach(c => {
    const k = kindOf(c); if (!k) return;
    const d = i + 1; if (windowOf(new Date(y, m, d), c.replace(/\*$/, ""))[0] <= now || requested.has(`${d}|${k}`)) return;
    const key = `${d}|${k}|${c}`, on = picks.includes(key);
    btns.push(`<button type="button" class="person ${k}" aria-pressed="${on}" data-act="ppick" data-key="${key}">${fmtS(r.mesic, {den:d, kind:k, kod:c})}</button>`);
  }));
  return `<p class="meta">Označ až 3 své služby, které nabízíš místo požadované (vybráno ${picks.length}/3):</p><div class="people">${btns.join("") || `<p class="empty">Nemáš v tom měsíci žádnou další budoucí službu.</p>`}</div>
    <div class="btns"><button type="button" class="btn" data-act="propsend" ${picks.length ? "" : "disabled"}>Odeslat návrh</button><button type="button" class="btn sec" data-act="propcancel">Zrušit</button></div>`;
}
async function loadMonthState(id){
  const [y, m] = ymOf(id);
  const p = await db.collection(COLLECTION).doc(id).get();
  const sw = await db.collection(SWAP_COL).where("mesic", "==", id).get();
  return applySwaps(p.exists ? p.data().plan : {}, sw.docs.map(d => ({id:d.id, ...d.data()})), new Date(y, m + 1, 0).getDate()).T;
}
async function siblingCheck(tx, r){
  for (const sid of (r.skupina || [])){
    if (sid === r.id) continue;
    const s = await tx.get(db.collection(SWAP_COL).doc(sid));
    if (s.exists && s.data().stav === "prijato") throw new Error("Výměnu už mezitím vzal jiný kolega.");
  }
}
const checksHTML = o => [...o.e.map(t => `<p class="e">${esc(t)}</p>`), ...o.w.map(t => `<p class="w">${esc(t)}</p>`), ...o.i.map(t => `<p class="i">${esc(t)}</p>`)].join("");
document.addEventListener("click", async e => {
  const b = e.target.closest(".req button[data-act]"); if (!b) return;
  const box = b.closest(".req"), id = box.dataset.id, msg = box.querySelector(".msg");
  const r = PENDING.find(x => x.id === id) || Object.values(M).flatMap(o => o.swaps).find(x => x.id === id); if (!r) return;
  const ref = db.collection(SWAP_COL).doc(id), act = b.dataset.act, FV = firebase.firestore.FieldValue;
  if (act === "revoke"){
    if (!confirm("Zrušit už přijatou výměnu? Služby se vrátí podle plánu.")) return;
    try { await ref.update({stav:"zruseno", zrusil:SELF_EMAIL}); }
    catch (err){ msg.innerHTML = `<p class="e">${esc(err.code === "permission-denied" ? "Na tuhle akci nemáš oprávnění." : "Zrušení se nepovedlo.")}</p>`; }
    return;
  }
  if (act === "propose"){ PROP = {id, picks:[]}; render(); return; }
  if (act === "propcancel"){ PROP = null; render(); return; }
  if (act === "ppick"){ const k = b.dataset.key, i = PROP.picks.indexOf(k); if (i >= 0) PROP.picks.splice(i, 1); else if (PROP.picks.length < 3) PROP.picks.push(k); render(); return; }
  box.querySelectorAll("button").forEach(x => x.disabled = true);
  try {
    const [y, m] = ymOf(r.mesic);
    const check = async req => {
      msg.innerHTML = `<p class="i">Kontroluji plán…</p>`;
      const out = simulate(await loadMonthState(r.mesic), req, act === "choose" ? null : SELF, y, m);
      msg.innerHTML = checksHTML(out);
      if (out.e.length) throw null;
      if (out.w.length && !confirm("Výměna má upozornění. Přesto pokračovat?")) throw null;
    };
    if (act === "accept" || act === "take"){
      await check(r);
      await db.runTransaction(async tx => {
        const s = await tx.get(ref);
        if (!s.exists || s.data().stav !== "ceka") throw new Error("Žádost už byla vyřízena.");
        await siblingCheck(tx, r);
        const upd = {stav:"prijato", vyrizeno:FV.serverTimestamp()};
        if (act === "take"){ upd.zaCislo = SELF_NO; upd.za = {jmeno:SELF, cislo:SELF_NO}; }
        tx.update(ref, upd);
      });
    } else if (act === "acceptopt" || act === "choose"){
      const list = act === "acceptopt" ? r.moznosti : r.navrhy, x = parseProp((list || [])[+b.dataset.n]);
      const newZa = {jmeno:r.za.jmeno, cislo:r.za.cislo, den:x.den, kind:x.kind, kod:x.kod};
      await check(act === "choose" ? {...r, typ:"vymena", za:newZa} : {...r, za:newZa});
      await db.runTransaction(async tx => {
        const s = await tx.get(ref), want = act === "choose" ? "navrh" : "ceka";
        if (!s.exists || s.data().stav !== want) throw new Error("Žádost už byla vyřízena.");
        await siblingCheck(tx, r);
        tx.update(ref, act === "choose" ? {stav:"prijato", typ:"vymena", za:newZa, vyrizeno:FV.serverTimestamp()} : {stav:"prijato", za:newZa, vyrizeno:FV.serverTimestamp()});
      });
    } else if (act === "propsend"){
      await db.runTransaction(async tx => {
        const s = await tx.get(ref);
        if (!s.exists || s.data().stav !== "ceka") throw new Error("Žádost už byla vyřízena.");
        tx.update(ref, {stav:"navrh", navrhy:PROP.picks.slice(0, 3), navrhnuto:FV.serverTimestamp()});
      });
      PROP = null;
    } else if (act === "reject" || act === "rejectprop"){
      await ref.update({stav:"odmitnuto", vyrizeno:FV.serverTimestamp()});
    } else if (act === "cancel"){
      if (!confirm("Zrušit tuto žádost?")) throw null;
      await ref.update({stav:"zruseno", vyrizeno:FV.serverTimestamp()});
    }
  } catch (err){
    if (err) msg.innerHTML += `<p class="e">${esc(err.code === "permission-denied" ? "Na tuhle akci nemáš oprávnění." : (err.message || "Akce se nepovedla."))}</p>`;
    box.querySelectorAll("button").forEach(x => x.disabled = false);
  }
});

function personHTML(p){ const me = p.name === ME; return `<div class="p${me ? " me" : ""}">${esc(shortName(p.name))}${p.note ? `<span class="sw">⇄ ${esc(p.note)}</span>` : ""}</div>`; }
function weekHTML(){
  const now = getNow(), days = Array.from({length:7}, (_, i) => addDays(WEEK, i));
  const end = days[6], title = WEEK.getMonth() === end.getMonth()
    ? `${WEEK.getDate()}.–${end.getDate()}. ${MONTHS_GEN[WEEK.getMonth()]} ${end.getFullYear()}`
    : `${WEEK.getDate()}. ${WEEK.getMonth() + 1}. – ${end.getDate()}. ${end.getMonth() + 1}. ${end.getFullYear()}`;
  const cols = days.map(dt => {
    const info = dayInfo(dt), we = dt.getDay() === 0 || dt.getDay() === 6, today = sameDay(dt, now);
    const head = `<div class="dhead${today ? " today" : ""}${we ? " we" : ""}"><span class="w">${DOW_T[dt.getDay()]}${today ? " · dnes" : ""}</span><span class="d">${dt.getDate()}. ${dt.getMonth() + 1}.</span></div>`;

      const mine = SELF && [s.stala, ...s.hl].some(p => p && p.name === SELF);
      const pct = live ? Math.round((now - ws) / (we2 - ws) * 100) : 0;
      const absTxt = k === "D" ? [info.A.DOV ? "DOV " + info.A.DOV.map(n => n.split(" ")[0]).join(", ") : "", info.A.ZdV ? "ZdV " + info.A.ZdV.map(n => n.split(" ")[0]).join(", ") : "", info.P.length ? "Porada D2: " + info.P.length + "×" : ""].filter(Boolean).join(" · ") : "";

  const title = `Můj plán · ${cap(MONTHS[m])} ${y}`;

let KF = null; // týden {mode:"week", key:"YYYY-MM|d", k}, měsíc {mode:"month", r, d}
function kfEl(){
  if (!KF) return null;

  if (KF.mode === "month" && PMODE === "month") return MAIN.querySelector(`.mc[data-r="${KF.r}"][data-d="${KF.d}"]`);

function kfFocus(){ const el = kfEl(); if (el){ el.focus({preventScroll:true}); el.scrollIntoView({block:"nearest", inline:"nearest"}); } }
document.addEventListener("keydown", e => {
  if (!/^Arrow(Left|Right|Up|Down)$/.test(e.key) || e.altKey || e.ctrlKey || e.metaKey) return;
  if ($("app").hidden || DET || SW || VIEW !== "plan") return;
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  e.preventDefault();
  const dx = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0, dy = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
  if (PMODE === "week"){
    const now = getNow();
    let date = KF && KF.mode === "week" ? (() => { const [id, d] = KF.key.split("|"); const [y, m] = ymOf(id); return new Date(y, m, +d); })() : null;
    let k = KF && KF.mode === "week" ? KF.k : "D";
    if (!date){ date = (now >= WEEK && now < addDays(WEEK, 7)) ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : new Date(WEEK); }
    else {
      if (dy) k = k === "D" ? "N" : "D";
      if (dx) date = addDays(date, dx);
    }
    if (date < WEEK) WEEK = addDays(WEEK, -7);
    if (date >= addDays(WEEK, 7)) WEEK = addDays(WEEK, 7);
    KF = {mode:"week", key:`${idOf(date)}|${date.getDate()}`, k};
  } else if (PMODE === "mine"){
    const n = new Date(MY_.y, MY_.m + 1, 0).getDate(), now = getNow();
    if (!KF || KF.mode !== "mine") KF = {mode:"mine", d:(now.getFullYear() === MY_.y && now.getMonth() === MY_.m) ? now.getDate() : 1};
    else {
      let d = KF.d + dx + dy * 7;
      if (d < 1){ const t = new Date(MY_.y, MY_.m - 1, 1); MY_ = {y:t.getFullYear(), m:t.getMonth()}; d = new Date(MY_.y, MY_.m + 1, 0).getDate() + d; }
      else if (d > n){ const t = new Date(MY_.y, MY_.m + 1, 1); MY_ = {y:t.getFullYear(), m:t.getMonth()}; d = d - n; }
      KF.d = d;
    }
  } else {
    const rows = new Set([...MAIN.querySelectorAll(".mc[data-r]")].map(x => +x.dataset.r)), R = rows.size;
    const n = new Date(MY_.y, MY_.m + 1, 0).getDate();
    if (!KF || KF.mode !== "month"){ const now = getNow(); KF = {mode:"month", r:Math.max(0, [...MAIN.querySelectorAll(".mn")].findIndex(x => x.classList.contains("me"))), d:(now.getFullYear() === MY_.y && now.getMonth() === MY_.m) ? now.getDate() : 1}; }
    else { KF.r = Math.min(R - 1, Math.max(0, KF.r + dy)); KF.d = Math.min(n, Math.max(1, KF.d + dx)); }
  }
  render();
});

MAIN.addEventListener("change", e => { if (SW && e.target.id === "swKolega"){ SW.kolega = e.target.value; SW.targets = []; render(); } });

/* ----- plánování volna ----- */
function openVol(){
  const now = getNow(); let y = now.getFullYear(), m = now.getMonth() + 1;
  if (m > 11){ m = 0; y++; }
  const ys = Object.keys(DLP).map(Number).sort();
  if (!DLP[y] || !DLP[y][SELF]){ if (y > ys[ys.length - 1]){ y = ys[ys.length - 1]; m = 10; } else { y = ys[0]; m = 0; } }
  VOL = {y, m, draft:new Set(), edit:null};
}
const vStats = dny => volStatsFor(SELF, dny);
function volMonthHTML(y, m, saved){
  const row = dlpOf(SELF, y, m) || "", n = new Date(y, m + 1, 0).getDate(), off = (new Date(y, m, 1).getDay() + 6) % 7;
  let cD = 0, cN = 0;
  let h = ["Po","Út","St","Čt","Pá","So","Ne"].map(d => `<div class="dw">${d}</div>`).join("");
  for (let i = 0; i < off; i++) h += `<div></div>`;
  for (let d = 1; d <= n; d++){
    const c = row[d - 1] || ".", k = dkey(y, m, d), on = VOL.draft.has(k), sv = saved.has(k);
    if (c === "D") cD++; if (c === "N") cN++;
    h += `<button type="button" class="cd ${c === "D" ? "D" : c === "N" ? "N" : ""}${on ? " vsel" : ""}${sv ? " vsaved" : ""}" data-vk="${k}" aria-pressed="${on}" aria-label="${d}. ${m + 1}.${c === "D" ? " D12" : c === "N" ? " N12" : ""}${on ? ", vybráno" : sv ? ", naplánované volno" : ""}"><b>${d}</b><small>${c === "D" ? "D12" : c === "N" ? "N12" : ""}</small>${on || sv ? `<span class="v">V</span>` : ""}</button>`;
  }
  return `<section class="panel" style="flex:1 1 360px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px"><h2 style="font-size:26px;margin:0;white-space:nowrap">${cap(MONTHS[m])} ${y}</h2><span class="status" style="text-align:right">Denní ${cD} · Noční ${cN} · ${fmtH((cD + cN) * DLP_H)} h</span></div><div class="cal">${h}</div></section>`;
}
function volHTML(){
  if (!SELF || !DLP_ANY(SELF)) return `<div class="bar"><h1>Plánování volna</h1></div><div class="panel"><p class="empty">Pro tebe zatím není nahraný dlouhodobý plán.</p></div>`;
  const saved = new Map(); MY_VOLP.forEach(e => { if (e.id !== VOL.edit) e.dny.forEach(k => saved.set(k, e.id)); });
  const savedSet = new Set(saved.keys());
  const {y, m} = VOL, m2 = m + 1;
  const t2 = new Date(y, m2, 1), months = volMonthHTML(y, m, savedSet) + (dlpOf(SELF, t2.getFullYear(), t2.getMonth()) ? volMonthHTML(t2.getFullYear(), t2.getMonth(), savedSet) : "");
  const dr = [...VOL.draft], gs = volGroups(dr), st = vStats(dr);
  const draftBox = (VOL.draft.size || VOL.edit) ? `<section class="sum" style="flex:1 1 100%;color:var(--ink);flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 24px">
      <div style="flex:1 1 420px"><p><b>${VOL.edit ? "Úprava volna" : "Nové volno"}:</b> ${dr.length ? volRanges(dr) : "žádný den"}</p>
      ${gs.length > 1 ? gs.map(g => `<p>${g.label}: ${volLine(vStats(g.dny))}</p>`).join("") : ""}
      <p style="font-weight:600">${dr.length ? (gs.length > 1 ? "Celkem: " + volLine(st).charAt(0).toLowerCase() + volLine(st).slice(1) : volLine(st)) : ""}</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" id="vSave" ${dr.length ? "" : "disabled"}>Uložit</button>${VOL.edit ? `<button type="button" class="btn danger" id="vDel">Smazat</button>` : ""}<button type="button" class="btn sec" id="vCancel">Zrušit</button></div></section>` : "";
  const list = [...MY_VOLP].sort((a, b) => (a.dny[0] < b.dny[0] ? -1 : 1));
  const byY = {}; list.forEach(e => e.dny.forEach(k => { (byY[k.slice(0, 4)] ||= []).push(k); }));
  const items = list.map(e => { const g = volGroups(e.dny), x = vStats(e.dny);
    return `<div class="vitem${e.id === VOL.edit ? " edit" : ""}"><button type="button" class="body" data-vid="${e.id}">${g.map(z => `<span class="g"><b>${z.label}</b><br>${volLine(vStats(z.dny))}</span>`).join("")}${g.length > 1 ? `<span class="tot">Celkem: ${volLine(x).charAt(0).toLowerCase() + volLine(x).slice(1)}</span>` : ""}</button>
      <button type="button" class="copy" data-vcopy="${e.id}" aria-label="Zkopírovat text volna" title="Zkopírovat text"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>`; }).join("");
  const totals = Object.keys(byY).sort().map(yy => { const t = vStats(byY[yy]); return `<div class="ytot"><div>Celkem za kalendářní rok ${yy}</div><div class="big">${fmtH(t.h)} h</div><div>vyčerpáno · dovolená ${t.d + t.n} (denní ${t.d}, noční ${t.n})</div></div>`; }).join("");
  return `<div class="bar"><button type="button" class="sq" data-vnav="-1" aria-label="Předchozí měsíce">‹</button><button type="button" class="sq" data-vnav="1" aria-label="Další měsíce">›</button>
      <div><h1>Plánování volna</h1><div class="status">${esc(SELF)} – podle dlouhodobého plánu ${y}. Vidíš jen ty. Den se službou = dovolená, bez služby = volno.</div></div></div>
    <div class="planwrap"><div style="flex:999 1 720px;min-width:0;display:flex;flex-wrap:wrap;gap:20px">${months}${draftBox}
      <p class="hint" style="flex:1 1 100%">Klepej na dny volna a dej Uložit. Uložené volno upravíš klepnutím na něj vpravo.</p></div>
      <aside class="rail"><h2 style="font-size:24px">Naplánované volno</h2>${items || `<p class="empty">Zatím nic.</p>`}${totals}<div class="checks" id="vMsg"></div></aside></div>`;
}
function volText(e){
  const x = vStats(e.dny), lines = [`Plánované volno – ${SELF}`];
  volGroups(e.dny).forEach(g => {
    lines.push("", `${g.label}: ${volLine(vStats(g.dny))}`);
    g.dny.filter(k => dlpCodeFor(SELF, k) !== ".").forEach(k => { const d = dparse(k), w = DOW[new Date(d.y, d.m, d.d).getDay()];
      lines.push(`– ${w} ${d.d}. ${d.m + 1}. ${dlpCodeFor(SELF, k) === "N" ? "N12 noční" : "D12 denní"}`); });
  });
  if (volGroups(e.dny).length > 1) lines.push("", `Celkem: ${volLine(x).charAt(0).toLowerCase() + volLine(x).slice(1)}`);
  return lines.join("\n").replace(/\u00a0/g, " ");
}
async function volWrite(list){
  const FV = firebase.firestore.FieldValue;
  await db.collection("poznamky").doc(SELF_NO).set({volnoPlany:list, volno:FV.delete(), upraveno:FV.serverTimestamp()}, {merge:true});
}
MAIN.addEventListener("click", async e => {
  if (VIEW !== "volno" || SW) return;
  const nv = e.target.closest("[data-vnav]");
  if (nv){ const t = new Date(VOL.y, VOL.m + (+nv.dataset.vnav), 1), y = t.getFullYear(), m = t.getMonth();
    // vlevo vždy existující měsíc; vpravo se ukáže druhý, pokud je v plánu
    if (dlpOf(SELF, y, m) && (+nv.dataset.vnav < 0 || dlpOf(SELF, y, m + 1) || m === 11)){ VOL.y = y; VOL.m = m; render(); } return; }
  const c = e.target.closest("[data-vk]");
  if (c){ const k = c.dataset.vk, owner = MY_VOLP.find(x => x.id !== VOL.edit && x.dny.includes(k));
    if (owner){ if (!VOL.draft.size){ VOL.edit = owner.id; VOL.draft = new Set(owner.dny); } else alert("Tento den už je v jiném naplánovaném volnu."); render(); return; }
    if (VOL.draft.has(k)) VOL.draft.delete(k); else VOL.draft.add(k); render(); return; }
  const it = e.target.closest("[data-vid]");
  if (it){ const x = MY_VOLP.find(v => v.id === it.dataset.vid); if (!x) return;
    if (VOL.draft.size && VOL.edit !== x.id && !confirm("Rozpracovaný výběr se zahodí. Pokračovat?")) return;
    VOL.edit = x.id; VOL.draft = new Set(x.dny); const f = dparse(x.dny.slice().sort()[0]); VOL.y = f.y; VOL.m = f.m; render(); return; }
  const cp = e.target.closest("[data-vcopy]");
  if (cp){ const x = MY_VOLP.find(v => v.id === cp.dataset.vcopy); if (!x) return; const t = volText(x);
    try { await navigator.clipboard.writeText(t); $("vMsg").innerHTML = `<p class="i">Text volna je zkopírovaný – vlož ho do e-mailu nebo zprávy.</p>`; }
    catch (err){ prompt("Zkopíruj text volna:", t); } return; }
  if (e.target.id === "vCancel"){ VOL.draft = new Set(); VOL.edit = null; render(); return; }
  if (e.target.id === "vSave" || e.target.id === "vDel"){
    const del = e.target.id === "vDel";
    if (del && !confirm("Smazat toto naplánované volno?")) return;
    let list = MY_VOLP.filter(x => x.id !== VOL.edit);
    if (!del) list.push({id:VOL.edit || Date.now().toString(36), dny:[...VOL.draft].sort()});
    try { await volWrite(list); MY_VOLP = list; VOL.draft = new Set(); VOL.edit = null; render(); }
    catch (err){ $("vMsg").innerHTML = `<p class="e">Volno se nepodařilo uložit.</p>`; }
  }
});
/* ----- administrace ----- */
function admReq(){
  const r = {typ:ADM.typ, mesic:docId(ADM.y, ADM.m), od:{jmeno:ADM.from, cislo:String(OFFICERS[ADM.from] || ""), ...ADM.fromShift}, za:{jmeno:ADM.to, cislo:String(OFFICERS[ADM.to] || "")}};
  if (ADM.typ === "vymena" && ADM.toShift) Object.assign(r.za, ADM.toShift);
  return r;
}
function admCal(id, name, side, sel, mark){
  return calHTML(id, name, c => {
    const cls = (mark && c.d === mark ? "give " : "") + (c.today ? "today " : "");
    if (!c.kind) return {cls:cls + "dim"};
    const on = sel && sel.den === c.d && sel.kind === c.kind;
    return {cls:cls + (on ? "pick" : ""), attr:`data-apick="${side}|${c.d}|${c.kind}|${c.main}"`};
  });
}
function admHTML(){
  if (!isAdmin()) return `<div class="panel"><p class="empty">Administrace je jen pro správce.</p></div>`;
  const nowMs = getNow().getTime();
  const onCnt = Object.values(ONLINE).filter(o => o.prihlasen !== false && o.posledni && o.posledni.toMillis && nowMs - o.posledni.toMillis() < ONLINE_MS).length;
  const tabs = `<div class="seg" role="group" aria-label="Administrace"><button type="button" data-atab="zmeny" aria-pressed="${ADM.tab !== "uziv"}">Změny služeb</button><button type="button" data-atab="uziv" aria-pressed="${ADM.tab === "uziv"}">Uživatelé${onCnt ? ` · ${onCnt} online` : ""}</button></div>`;
  if (ADM.tab === "uziv"){
    return `<div class="bar"><h1>Administrace</h1>${tabs}</div>
      <section class="panel" style="max-width:980px">${presenceHTML(OFFICERS, ONLINE, nowMs, {desktop:DESK_VER})}${window.SluzbyChat ? SluzbyChat.adminHTML() : ""}</section>`;
  }
  const id = docId(ADM.y, ADM.m), o = month(id);
  const bar = `<div class="bar"><button type="button" class="sq" data-anav="-1" aria-label="Předchozí měsíc">‹</button><button type="button" class="sq" data-anav="1" aria-label="Další měsíc">›</button>
    <h1>Administrace · ${cap(MONTHS[ADM.m])} ${ADM.y}</h1>${tabs}</div>`;
  if (!o.okP) return bar + `<p class="status">Načítám plán…</p>`;
  if (!o.exists) return bar + `<div class="panel"><p class="empty">Plán na tento měsíc není nahraný.</p></div>`;
  const names = Object.keys(o.T).sort((a, b) => a.localeCompare(b, "cs"));
  const opt = (sel, excl) => `<option value="">Vyber strážníka</option>` + names.filter(n => n !== excl).map(n => `<option${n === sel ? " selected" : ""}>${esc(n)}</option>`).join("");
  const ready = ADM.from && ADM.fromShift && ADM.to && (ADM.typ === "prevzeti" || ADM.toShift);
  const [y, m] = [ADM.y, ADM.m];
  const chk = ready ? simulate(o.T, admReq(), null, y, m) : {e:[], w:[], i:[]};
  const fs = t => fmtS(id, t);
  const log = o.swaps.slice().sort((a, b) => tsMs(b.vyrizeno || b.vytvoreno) - tsMs(a.vyrizeno || a.vytvoreno));
  const logHTML = log.length ? log.map(r => `<div class="req" data-id="${r.id}"><p>${r.admin ? (r.typ === "vymena" ? `<b>${esc(r.od.jmeno)}</b> ${fs(r.od)} ⇄ <b>${esc(r.za.jmeno)}</b> ${fs(r.za)}.` : `Služba ${fs(r.od)} převedena: <b>${esc(r.od.jmeno)}</b> → <b>${esc(r.za.jmeno)}</b>.`) : reqText(r)} <span class="stbadge">${r.admin && r.stav === "prijato" ? "Změna administrátorem" : ST_LBL[r.stav] || ""}</span></p>${r.pozn ? `<p class="pz">„${esc(r.pozn)}“</p>` : ""}${r.stav === "prijato" ? `<div class="btns"><button type="button" class="btn danger sm" data-act="revoke">Zrušit výměnu</button></div>` : ""}<div class="checks msg"></div><span class="go">Zobrazit v plánu ›</span></div>`).join("") : `<p class="empty">Zatím žádné změny.</p>`;
  return `${bar}
    <p class="status">Změna platí hned, bez potvrzení strážníků.</p>
    <div class="seg" role="group" aria-label="Typ změny" style="align-self:flex-start"><button type="button" data-atyp="prevzeti" aria-pressed="${ADM.typ === "prevzeti"}">Převést službu</button><button type="button" data-atyp="vymena" aria-pressed="${ADM.typ === "vymena"}">Vyměnit služby</button></div>
    <div class="cols">
      <section class="panel"><label class="field"><span style="font-family:var(--f-cond);font-weight:700;font-size:22px">${ADM.typ === "vymena" ? "První strážník" : "Komu službu vzít"}</span><select id="admFrom">${opt(ADM.from, ADM.to)}</select></label>
        ${ADM.from ? `<div style="margin-top:12px">${admCal(id, ADM.from, "from", ADM.fromShift, ADM.typ === "vymena" && ADM.toShift ? ADM.toShift.den : null)}</div><p class="hint" style="margin-top:8px">${ADM.fromShift ? "Vybráno: <b>" + fs(ADM.fromShift) + "</b>" : "Klepni na jeho službu."}</p>` : ""}</section>
      <section class="panel"><label class="field"><span style="font-family:var(--f-cond);font-weight:700;font-size:22px">${ADM.typ === "vymena" ? "Druhý strážník" : "Komu službu dát"}</span><select id="admTo">${opt(ADM.to, ADM.from)}</select></label>
        ${ADM.typ === "vymena" && ADM.to ? `<div style="margin-top:12px">${admCal(id, ADM.to, "to", ADM.toShift, ADM.fromShift ? ADM.fromShift.den : null)}</div><p class="hint" style="margin-top:8px">${ADM.toShift ? "Vybráno: <b>" + fs(ADM.toShift) + "</b>" : "Klepni na jeho službu."}</p>` : ADM.typ === "prevzeti" && ADM.to ? `<p class="hint" style="margin-top:10px">${esc(ADM.to)} dostane službu, za kterou nic nedává.</p>` : ""}</section>
      <aside class="rail">
        <section class="sum"><h2>Shrnutí</h2>${ADM.fromShift && ADM.from ? `<p><b>${esc(ADM.from)}</b> · ${fs(ADM.fromShift)}</p>` : `<p style="color:var(--ink2)">Vyber prvního strážníka a službu.</p>`}
          ${ADM.to ? `<p>${ADM.typ === "vymena" ? "⇄" : "→"} <b>${esc(ADM.to)}</b>${ADM.toShift ? " · " + fs(ADM.toShift) : ""}</p>` : ""}</section>
        ${chk.e.length + chk.w.length + chk.i.length ? `<section class="panel checks"><h2 style="font-size:20px">Kontrola plánu</h2>${checksHTML(chk)}</section>` : ""}
        <label class="field">Poznámka (nepovinné)<textarea id="admPozn" rows="2" maxlength="140">${esc(ADM.pozn)}</textarea></label>
        <button type="button" class="btn" id="admSave" style="min-height:52px;font-family:var(--f-cond);font-size:22px" ${ready ? "" : "disabled"}>Uložit změnu</button>
        <div class="checks" id="admMsg"></div>
      </aside>
    </div>
    <section class="panel"><h2>Všechny změny – ${MONTHS[ADM.m]}</h2>${logHTML}</section>`;
}
MAIN.addEventListener("click", async e => {
  if (VIEW !== "admin" || SW) return;
  const tb = e.target.closest("[data-atab]"); if (tb){ ADM.tab = tb.dataset.atab; render(); return; }
  const an = e.target.closest("[data-anav]"); if (an){ const t = new Date(ADM.y, ADM.m + (+an.dataset.anav), 1); ADM.y = t.getFullYear(); ADM.m = t.getMonth(); ADM.fromShift = ADM.toShift = null; render(); return; }
  const ty = e.target.closest("[data-atyp]"); if (ty){ ADM.typ = ty.dataset.atyp; ADM.toShift = null; render(); return; }
  const pk = e.target.closest("[data-apick]"); if (pk){ const [side, d, k, c] = pk.dataset.apick.split("|"), v = {den:+d, kind:k, kod:c}; if (side === "to") ADM.toShift = v; else ADM.fromShift = v; render(); return; }
  if (e.target.id === "admSave"){
    const btn = e.target; btn.disabled = true;
    const r = admReq(), o = month(r.mesic), out = simulate(o.T, r, null, ADM.y, ADM.m);
    if ((out.e.length || out.w.length) && !confirm("Změna má upozornění:\n\n" + [...out.e, ...out.w].join("\n") + "\n\nPřesto uložit?")){ btn.disabled = false; return; }
    const FV = firebase.firestore.FieldValue;
    try {
      await db.collection(SWAP_COL).add({typ:r.typ, admin:true, mesic:r.mesic, stav:"prijato", odCislo:r.od.cislo, zaCislo:r.za.cislo,
        od:r.od, za:r.za, pozn:ADM.pozn.trim(), zmenil:SELF_EMAIL, vytvoreno:FV.serverTimestamp(), vyrizeno:FV.serverTimestamp()});
      ADM.fromShift = ADM.toShift = null; ADM.pozn = ""; render();
    } catch (err){
      $("admMsg").innerHTML = `<p class="e">${esc(err.code === "permission-denied" ? "Uložení zamítnuto pravidly Firestore." : "Uložení se nepovedlo.")}</p>`;
      btn.disabled = false;
    }
  }
});
MAIN.addEventListener("change", e => {
  if (VIEW !== "admin") return;
  if (e.target.id === "admFrom"){ ADM.from = e.target.value; ADM.fromShift = null; render(); }
  if (e.target.id === "admTo"){ ADM.to = e.target.value; ADM.toShift = null; render(); }
});
MAIN.addEventListener("input", e => { if (VIEW === "admin" && e.target.id === "admPozn") ADM.pozn = e.target.value; });
setInterval(() => { if (VIEW === "admin" && ADM.tab === "uziv") render(); }, 30e3);
window.addEventListener("beforeunload", e => { if (VOL.draft.size || (SW && SW.targets.length)){ e.preventDefault(); e.returnValue = ""; } });
setInterval(() => { if (!$("app").hidden && !SW && VIEW === "plan") render(); }, 60000);
