<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dozorčí služba – MP Blansko</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#E9ECF1;--sheet:#fff;--ink:#1D2A4D;--ink2:#6A7488;--line:#D7DCE4;--soft:#F4F6F9;--blue:#2F6FDB;--red:#D63031;--green:#2E9E5B;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:Barlow,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px}
.top b{font-family:var(--f-cond);font-size:22px;letter-spacing:.02em}
.top .pill{background:rgba(255,255,255,.12);padding:5px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.top .sp{flex:1}
.top .clk{font-family:var(--f-cond);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.top button{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:5px 11px;font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px}
.dot.off{background:#9AA3B5}
.wrap{display:flex;height:calc(100vh - 56px)}
.col{background:var(--sheet);display:flex;flex-direction:column;min-height:0}
h3{margin:0;padding:14px 18px 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
/* formulář */
.form{width:400px;flex:none;border-right:1px solid var(--line);overflow-y:auto}
.fm{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.lb{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:10px;border:1.5px solid #C9CFDA;background:#fff;font-weight:600;font-size:13.5px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button kbd{font-family:inherit;font-size:10.5px;opacity:.55;margin-left:4px}
.fi{width:100%;height:42px;border:1.5px solid #C9CFDA;border-radius:10px;padding:0 11px;font-size:15.5px;background:#fff}
.fi:focus,textarea.fi:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,219,.15)}
textarea.fi{height:84px;padding:9px 11px;resize:vertical;line-height:1.4}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aq{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:1000;background:#fff;border:1.5px solid #C9CFDA;border-radius:10px;margin-top:3px;box-shadow:0 10px 24px rgba(0,0,0,.18);overflow:hidden}
.sug button{display:block;width:100%;text-align:left;border:0;border-top:1px solid #EEF0F4;background:none;padding:8px 11px}
.sug button:first-child{border-top:0}.sug button.on,.sug button:hover{background:#EEF3FC}
.sug small{display:block;color:var(--ink2);font-size:12px}
.pv{font-size:13.5px;color:var(--ink2);min-height:18px}.pv b{color:var(--ink)}.pv .ok{color:var(--green);font-weight:700}
.btns{display:flex;gap:10px}
.btn{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.btn.bl{background:var(--blue);flex:1}.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.kb{font-size:12px;color:#8A93A6;line-height:1.7}.kb kbd{background:#EEF0F4;border:1px solid #C9CFDA;border-radius:5px;padding:0 5px;font-family:inherit}
.err{color:#B23A3A;font-weight:600;font-size:13.5px;margin:0}
.to{font-size:13.5px;color:var(--ink2);margin:-4px 0 0}.to b{color:var(--ink)}
/* mapa */
.mapw{flex:1;position:relative;min-width:0;background:#DDE5D6}
#map{position:absolute;inset:0}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:15px;text-align:center;padding:30px}
.lg{position:absolute;left:14px;bottom:14px;z-index:500;background:#fff;border-radius:12px;padding:8px 13px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 5px 0 10px}.lg i:first-child{margin-left:0}
.mk{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap}
.mk b{background:#fff;border-radius:8px;padding:3px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.22);font-family:var(--f-body)}
.mk i{width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-top:3px}
.mk.done i{background:#8A93A6}.mk.done b{color:var(--ink2)}.mk.adr i{background:var(--blue)}
.mapy-logo{position:absolute;left:14px;top:14px;z-index:500}
/* chat */
.chat{width:480px;flex:none;border-left:1px solid var(--line)}
.tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;padding:8px 10px;border-radius:10px;border:0;background:#EEF0F4;font-weight:700;font-size:14px;text-align:center}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button small{display:block;font-weight:500;font-size:11.5px;opacity:.75}
.tabs em{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:0 7px;font-size:12px;margin-left:5px}
.who{padding:8px 14px 6px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--soft)}
.empty{margin:auto;color:var(--ink2);text-align:center}
.day{align-self:center;font-size:12px;color:var(--ink2);background:#E3E7EE;padding:3px 10px;border-radius:10px}
.m{max-width:86%;padding:9px 13px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.4;overflow-wrap:anywhere}
.m>b{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
.m small.t{display:block;text-align:right;font-size:11.5px;color:#8A93A6;margin-top:2px}
.m.me{align-self:flex-end;background:var(--ink);color:#fff}.m.me small.t{color:#B7C0D6}
.m.oz{align-self:flex-end;background:#fff;color:var(--ink);border:2px solid var(--blue);max-width:94%}
.m.oz.done{border-color:#B7C0D6}
.m.hit{box-shadow:0 0 0 3px rgba(242,207,74,.9)}
.m img{display:block;max-width:100%;max-height:220px;border-radius:10px;margin:4px 0}
.m .del{font-style:italic;opacity:.6}
.typ{display:inline-block;background:#FDECEC;color:#B23A3A;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:3px 8px;margin-bottom:6px}
.done .typ{background:#EEF0F4;color:var(--ink2)}
.nad{display:flex;align-items:center;gap:10px;color:#D63031;font-family:var(--f-cond);font-size:21px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.15;text-align:center;margin:12px 0 8px}
.nad:before,.nad:after{content:"";flex:1;min-width:14px;height:3px;background:#D63031;border-radius:2px}
.ad{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.ad span{flex:1;font-weight:800;font-size:16.5px}
.ad a{background:var(--blue);color:#fff;border-radius:10px;padding:5px 11px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.m.me .ad a{background:#fff;color:var(--ink)}
.ozk{font-size:13.5px;color:var(--ink2);margin-top:2px}
.ack{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.ack span{font-size:12px;padding:2px 8px;border-radius:8px;background:#E6F4EC;color:#1F7A45;font-weight:700}
.ack span.w{background:#FFF4D6;color:#8A6A00}
.ack button{margin-left:auto;font-size:12.5px;font-weight:700;border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:2px 9px}
.rd{font-size:11.5px;color:#B7C0D6;margin-top:3px}
.inp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.inp textarea{flex:1;min-height:44px;max-height:140px;border:1.5px solid #C9CFDA;border-radius:22px;padding:10px 15px;resize:none;font-size:15px;line-height:1.35}
.inp textarea:focus{outline:none;border-color:var(--blue)}
.ro{padding:12px;text-align:center;color:var(--ink2);border-top:1px solid var(--line);background:#fff}
/* přihlášení */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2000}
.gate form{background:#fff;border-radius:18px;padding:26px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
.gate h1{font-family:var(--f-cond);margin:0 0 4px;font-size:28px}
.gate p{margin:0;color:var(--ink2);font-size:14px;min-height:18px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><form id="loginF">
  <h1>Dozorčí služba</h1>
  <input class="fi" id="email" type="email" autocomplete="username" placeholder="E-mail" value="dozorci@rzscanner.cz">
  <input class="fi" id="pass" type="password" autocomplete="current-password" placeholder="Heslo">
  <button class="btn" type="submit">Přihlásit</button>
  <p id="loginMsg"></p>
</form></div>

<header class="top">
  <b>MP Blansko · Dozorčí služba</b>
  <span class="pill" id="stav"><span class="dot off"></span>Načítám…</span>
  <span class="sp"></span>
  <button type="button" id="zvuk" title="Zvuk při nové zprávě od hlídky">🔔 Zvuk zapnutý</button>
  <span class="pill" id="ucet"></span>
  <button type="button" id="odhlasit">Odhlásit</button>
  <span class="clk" id="clk">--:--</span>
</header>

<div class="wrap">
  <section class="col form">
    <h3>Nové oznámení</h3>
    <div class="fm">
      <p class="to" id="to"></p>
      <div><span class="lb">Druh oznámení</span><div class="chips" id="druhy"></div></div>
      <div class="aq"><label class="lb" for="ul">Ulice nebo místní část</label>
        <input class="fi" id="ul" autocomplete="off" placeholder="např. Sladkovského"><div class="sug" id="sug" hidden></div></div>
      <div class="row">
        <div><label class="lb" for="cp">Č. p.</label><input class="fi" id="cp" autocomplete="off" placeholder="č. p."></div>
        <div><label class="lb" for="patro">Patro</label><select class="fi" id="patro"></select></div>
        <div><label class="lb" for="byt">Byt / vchod</label><input class="fi" id="byt" autocomplete="off"></div>
      </div>
      <div class="row2">
        <div><label class="lb" for="ozn">Oznamovatel</label><input class="fi" id="ozn" autocomplete="off"></div>
        <div><label class="lb" for="tel">Telefon</label><input class="fi" id="tel" autocomplete="off" inputmode="tel"></div>
      </div>
      <div><label class="lb" for="popis">Popis</label><textarea class="fi" id="popis"></textarea></div>
      <div class="pv" id="pv"></div>
      <p class="err" id="err" hidden></p>
      <div class="btns"><button type="button" class="btn bl" id="odeslat">Odeslat hlídce ▸</button><button type="button" class="btn sec" id="vymazat">Vymazat</button></div>
      <div class="kb">Odeslat <kbd>Ctrl</kbd>+<kbd>Enter</kbd> · další pole <kbd>Tab</kbd> · druh oznámení <kbd>F1</kbd>–<kbd>F9</kbd> · vymazat <kbd>Esc</kbd></div>
    </div>
  </section>

  <section class="mapw">
    <div id="map"></div>
    <div class="nomap" id="nomap" hidden>Mapu se nepodařilo načíst.</div>
    <a class="mapy-logo" href="https://mapy.com/" target="_blank" rel="noopener"><img src="https://api.mapy.cz/img/api/logo.svg" alt="Mapy.com" height="22"></a>
    <div class="lg"><i style="background:#D63031"></i>otevřené oznámení<i style="background:#8A93A6"></i>vyřízené<i style="background:#2F6FDB"></i>adresa od hlídky</div>
  </section>

  <section class="col chat">
    <div class="tabs" id="tabs"></div>
    <div class="who" id="who"></div>
    <div class="msgs" id="msgs"><p class="empty">Načítám hlídky…</p></div>
    <div id="inBox"></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* Dozorčí služba – oznámení do chatu hlídky. Účet dozorci@rzscanner.cz píše do vláken hlídek jako „DS“. */
const VER = "dozorčí v1.2";
const ME = "DS", MEJM = "Dozorčí služba", DZ_EMAIL = "dozorci@rzscanner.cz";
const MAPY_KEY = "nY-91216wSSQ5waRO4ABMmtDldTuDGTPzp8kd8WcsQM";
const BLANSKO = [49.3632, 16.6445];
const DRUHY = ["Rušení nočního klidu", "Parkování", "Dopravní nehoda", "Podnapilá osoba", "Volně pobíhající pes", "Výtržnost", "Krádež", "Podezřelá osoba", "Jiné"];
const PATRA = ["", "suterén", "přízemí", "1. patro", "2. patro", "3. patro", "4. patro", "5. patro", "6. patro", "7. patro", "8. patro", "podkroví"];
const DOW = ["ne", "po", "út", "st", "čt", "pá", "so"];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qNow = new URLSearchParams(location.search).get("now");
const T0 = Date.now(), now = () => qNow ? new Date(qNow).getTime() + (Date.now() - T0) : Date.now();
const ms = t => !t ? 0 : t.toMillis ? t.toMillis() : t.seconds ? t.seconds * 1000 : +t || 0;
const hm = t => { const d = new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
const pad = n => String(n).padStart(2, "0");
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>"); }
const navUrl = a => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(a.adresa)}&travelmode=driving`;

let MANUAL = false, db = null, auth = null, CISLA = {}, JMENA = {}, TH = {}, thUnsubs = [], SEL = null, MSGS = [], msgUnsub = null, druh = "", zvuk = true, lastOther = {};
try { zvuk = localStorage.getItem("dzZvuk") !== "0"; } catch (e){}
const nameOf = c => JMENA[String(c)] || (String(c) === ME ? MEJM : "č. " + c);
const surname = c => String(nameOf(c)).split(" ")[0];

/* ---------- hodiny a stav ---------- */
setInterval(() => { $("clk").textContent = hm(now()); }, 1000); $("clk").textContent = hm(now());

/* ---------- přihlášení ---------- */
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey){
  firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(u => {
    if (!u){ stop(); $("gate").hidden = false; return; }
    if (String(u.email).toLowerCase() !== DZ_EMAIL){ $("gate").hidden = false; $("loginMsg").textContent = "Tahle stránka je jen pro účet dozorčí služby."; auth.signOut(); return; }
    $("gate").hidden = true; $("ucet").textContent = u.email; start();
  });
} else { $("gate").hidden = false; $("loginMsg").textContent = "Chybí nastavení Firebase (firebase-config.js)."; }
$("loginF").addEventListener("submit", async e => {
  e.preventDefault();
  try { $("loginMsg").textContent = "Přihlašuji…"; await auth.signInWithEmailAndPassword($("email").value.trim(), $("pass").value); }
  catch (er){ $("loginMsg").textContent = "Přihlášení se nepovedlo – zkontroluj e-mail a heslo."; }
});
$("odhlasit").addEventListener("click", () => { if (confirm("Odhlásit dozorčí službu?")) auth.signOut(); });
$("zvuk").addEventListener("click", () => { zvuk = !zvuk; try { localStorage.setItem("dzZvuk", zvuk ? "1" : "0"); } catch (e){} drawZvuk(); if (zvuk) beep(); });
function drawZvuk(){ $("zvuk").textContent = zvuk ? "🔔 Zvuk zapnutý" : "🔕 Zvuk vypnutý"; }
drawZvuk();

/* ---------- hlídky: vlákna h_RRRR-MM-DD_D/N (včera, dnes, zítra) ---------- */
function stop(){ thUnsubs.forEach(f => f()); thUnsubs = []; if (msgUnsub) msgUnsub(); msgUnsub = null; TH = {}; SEL = null; }
function start(){
  stop();
  db.collection("planSluzeb").doc("straznici").get().then(s => {
    CISLA = (s.exists && s.data().cisla) || {}; JMENA = {};
    Object.entries(CISLA).forEach(([n, c]) => { JMENA[String(c)] = n; });
    drawTabs(); drawMsgs();
  }).catch(() => {});
  watchThreads(); setInterval(watchThreads, 10 * 60e3); setInterval(() => { drawTabs(); drawState(); }, 30e3);
}
let watched = "";
function watchThreads(){
  const ids = [];
  for (let k = -1; k <= 1; k++){ const d = new Date(now()); d.setDate(d.getDate() + k); ["D", "N"].forEach(x => ids.push(`h_${isoD(d)}_${x}`)); }
  if (ids.join() === watched) return; watched = ids.join();
  thUnsubs.forEach(f => f()); thUnsubs = [];
  ids.forEach(id => thUnsubs.push(db.collection("chaty").doc(id).onSnapshot(s => {
    if (s.exists && s.data().typ === "hlidka") TH[id] = {id, ...s.data()}; else delete TH[id];
    onThreads(id);
  }, () => { delete TH[id]; onThreads(id); })));
}
function hState(t){ const n = now(); if (n < ms(t.zobrazitOd)) return "skryte"; if (n >= ms(t.archivOd)) return "archiv"; if (n < ms(t.start)) return "brzy"; if (n < ms(t.konec)) return "probiha"; return "skoncila"; }
function visible(){ return Object.values(TH).filter(t => ["probiha", "brzy", "skoncila"].includes(hState(t))).sort((a, b) => ms(a.start) - ms(b.start)); }
function onThreads(changed){
  const v = visible();
  // výchozí výběr: probíhající hlídka (dokud si dozorčí sám nevybere jinou záložku)
  const run = v.find(t => hState(t) === "probiha") || v.find(t => hState(t) === "brzy") || v[v.length - 1];
  const cur = SEL && v.find(t => t.id === SEL);
  if (run && run.id !== SEL && (!cur || (!MANUAL && hState(cur) !== "probiha"))) select(run.id);
  const t = TH[changed];
  if (t && SEL !== changed && t.posledni && String(t.posledni.od) !== ME){
    const at = ms(t.posledni.at); if (lastOther[changed] && at > lastOther[changed]) ping(); lastOther[changed] = at;
  }
  drawTabs(); drawState(); drawWho(); drawMsgs(); markSeen();
}
function unread(t){ return Math.max(0, (t.pocet || 0) - ((t.videno || {})[ME] || 0)); }
function tLabel(t){ const d = new Date(ms(t.start)), k = t.kind === "N" ? "Noční" : "Denní"; return {k, cas:`${hm(ms(t.start))}–${hm(ms(t.konec))}`, den:`${DOW[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}.`}; }
function drawTabs(){
  const v = visible();
  $("tabs").innerHTML = v.length ? v.map(t => { const L = tLabel(t), u = t.id === SEL ? 0 : unread(t), st = hState(t);
    return `<button type="button" class="${t.id === SEL ? "on" : ""}" data-th="${t.id}">${L.k} ${L.cas}${u ? `<em>${u}</em>` : ""}<small>${L.den} · ${st === "probiha" ? "probíhá" : st === "brzy" ? "začne v " + hm(ms(t.start)) : "skončila"}</small></button>`; }).join("")
    : `<p style="margin:6px 4px;color:var(--ink2)">Teď neběží žádná hlídka s chatem.</p>`;
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-th]"); if (b){ MANUAL = true; select(b.dataset.th); } });
function drawState(){
  const t = SEL && TH[SEL], st = t ? hState(t) : "";
  $("stav").innerHTML = t ? `<span class="dot${st === "probiha" ? "" : " off"}"></span>${tLabel(t).k} hlídka ${st === "probiha" ? "probíhá" : st === "brzy" ? "začne v " + hm(ms(t.start)) : "skončila"}` : `<span class="dot off"></span>Žádná hlídka`;
  const to = $("to");
  to.innerHTML = t ? `Odešle se: <b>${tLabel(t).k.toLowerCase()} hlídce ${esc(tLabel(t).den)}</b> (${(t.clenove || []).map(c => esc(surname(c))).join(", ")})` : "Teď není komu oznámení poslat.";
  $("odeslat").disabled = !t || st === "archiv";
}
function drawWho(){
  const t = SEL && TH[SEL]; if (!t){ $("who").textContent = ""; return; }
  $("who").textContent = (t.clenove || []).map(c => surname(c) + (String(c) === String(t.stala) ? " (stálá)" : "")).join(", ");
}
function select(id){
  if (SEL === id && msgUnsub) return;
  SEL = id; MSGS = []; if (msgUnsub) msgUnsub();
  $("msgs").innerHTML = `<p class="empty">Načítám zprávy…</p>`;
  msgUnsub = db.collection("chaty").doc(id).collection("zpravy").orderBy("at").limitToLast(300).onSnapshot(s => {
    const prev = MSGS.length;
    MSGS = s.docs.map(d => ({id:d.id, ...d.data({serverTimestamps:"estimate"})}));
    if (prev && MSGS.length > prev && MSGS.slice(prev).some(m => String(m.od) !== ME)) ping();
    drawMsgs(true); drawMap(); markSeen();
  }, () => { $("msgs").innerHTML = `<p class="empty">Chat hlídky se nepodařilo načíst (oprávnění).</p>`; });
  drawTabs(); drawState(); drawWho(); drawInput();
}

/* ---------- chat ---------- */
function readBy(t, m){
  const at = ms(m.at);
  return (t.clenove || []).map(String).map(c => ({c, ok:ms((t.lastSeen || {})[c]) >= at, t:ms((t.lastSeen || {})[c])}));
}
function msgHTML(m, t){
  const mine = String(m.od) === ME;
  if (m.smazano) return `<div class="m${mine ? " me" : ""}" data-mid="${m.id}"><span class="del">Zpráva byla smazána</span><small class="t">${hm(ms(m.at))}</small></div>`;
  const oz = m.oznameni, a = m.adresa;
  let h = "";
  if (!mine) h += `<b>${esc(surname(m.od) || m.jmeno)}</b>`;
  if (oz && m.vyrizeno) h += `<span class="typ" style="background:#E6F4EC;color:#1F7A45">✓ vyřízeno</span>`;
  if (a) h += `<div class="ad"><span>${esc(String(a.adresa).replace(/, Blansko$/, ""))}${a.patro ? " · " + esc(a.patro) : ""}${oz && oz.byt ? " · " + esc(oz.byt) : ""}</span><a href="${esc(navUrl(a))}" target="_blank" rel="noopener">▲ Navigovat</a></div>`;
  if (a || oz) h += `<span class="nad">${esc((oz && oz.druh) || "Oznámení")}</span>`;
  if (oz && (oz.oznamovatel || oz.telefon)) h += `<div class="ozk">Oznamovatel: ${esc(oz.oznamovatel || "")}${oz.telefon ? ` · tel. ${esc(oz.telefon)}` : ""}</div>`;
  if (m.image) h += `<img src="${esc(m.image)}" alt="Fotka" loading="lazy">`;
  if (m.anketa) h += `📊 ${esc(m.anketa.otazka || "Anketa")}`;
  else if (m.hra || m.lode || m.pexeso || m.sachy) h += "🎮 Hra";
  if (m.text) h += `<div>${linkify(m.text)}</div>`;
  h += `<small class="t">${mine ? "Dozorčí · " : ""}${m.at ? hm(ms(m.at)) : "odesílá se…"}</small>`;
  if (mine && t && !oz){
    const r = readBy(t, m).filter(x => x.ok);
    h += `<div class="rd">${r.length ? "✓ Přečetli: " + r.map(x => esc(surname(x.c))).join(", ") : "Zatím nikdo nečetl"}</div>`;
  } else if (mine && t){
    const r = readBy(t, m);
    h += `<div class="ack">${r.map(x => `<span class="${x.ok ? "" : "w"}">${x.ok ? "✓ " : ""}${esc(surname(x.c))}${x.ok ? "" : " – nepřečteno"}</span>`).join("")}${oz ? `<button type="button" data-vyr="${m.id}">${m.vyrizeno ? "Znovu otevřít" : "Vyřízeno"}</button>` : ""}</div>`;
  }
  return `<div class="m${oz ? " oz" + (m.vyrizeno ? " done" : "") : mine ? " me" : ""}" data-mid="${m.id}">${h}</div>`;
}
function drawMsgs(stick){
  const box = $("msgs"), t = SEL && TH[SEL]; if (!t){ if (!visible().length) box.innerHTML = `<p class="empty">Teď neběží žádná hlídka s chatem.</p>`; return; }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let lastDay = "", h = "";
  MSGS.forEach(m => { const d = m.at ? new Date(ms(m.at)) : new Date(now()), k = isoD(d);
    if (k !== lastDay){ lastDay = k; h += `<div class="day">${DOW[d.getDay()]} ${d.getDate()}. ${d.getMonth() + 1}.</div>`; }
    h += msgHTML(m, t); });
  box.innerHTML = h || `<p class="empty">V chatu hlídky zatím nic není.</p>`;
  if (stick || atBottom) box.scrollTop = box.scrollHeight;
}
$("msgs").addEventListener("click", async e => {
  const b = e.target.closest("[data-vyr]"); if (!b) return;
  const m = MSGS.find(x => x.id === b.dataset.vyr); if (!m) return;
  try { await db.collection("chaty").doc(SEL).collection("zpravy").doc(m.id).update({vyrizeno:!m.vyrizeno}); }
  catch (er){ toast("Nepodařilo se uložit (pravidla Firestore)."); }
});
function drawInput(){
  const t = SEL && TH[SEL];
  $("inBox").innerHTML = !t ? "" : hState(t) === "archiv" ? `<p class="ro">Archiv hlídky – jen ke čtení.</p>`
    : `<div class="inp"><textarea id="chT" rows="1" maxlength="2000" placeholder="Zpráva hlídce… (Enter odešle, Shift+Enter nový řádek)"></textarea><button type="button" class="btn" id="chS">Odeslat</button></div>`;
  const ta = $("chT"); if (!ta) return;
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendText(); } });
  $("chS").addEventListener("click", sendText);
}
async function sendText(){
  const ta = $("chT"), text = ta.value.trim(); if (!text) return;
  ta.value = ""; ta.style.height = "";
  try { await write({text}); } catch (e){ ta.value = text; toast(e.code === "permission-denied" ? "Odeslání zamítnuto pravidly Firestore." : "Zprávu se nepodařilo odeslat."); }
}
async function write(data, preview){
  const fv = firebase.firestore.FieldValue, ref = db.collection("chaty").doc(SEL), m = ref.collection("zpravy").doc(), b = db.batch();
  b.set(m, {od:ME, jmeno:MEJM, at:fv.serverTimestamp(), ...data});
  b.update(ref, {pocet:fv.increment(1), [`videno.${ME}`]:fv.increment(1),
    posledni:{text:String(preview || data.text || "").slice(0, 140), od:ME, jmeno:MEJM, at:fv.serverTimestamp()}});
  await b.commit();
}
let seenBusy = false;
function markSeen(){
  const t = SEL && TH[SEL]; if (!t || seenBusy || document.visibilityState !== "visible") return;
  if (((t.videno || {})[ME] || 0) === (t.pocet || 0)) return;
  seenBusy = true;
  db.collection("chaty").doc(SEL).update({[`videno.${ME}`]:t.pocet || 0, [`lastSeen.${ME}`]:firebase.firestore.FieldValue.serverTimestamp()})
    .catch(() => {}).then(() => { seenBusy = false; });
}
document.addEventListener("visibilitychange", markSeen);
window.addEventListener("focus", markSeen);

/* zvuk a titulek při nové zprávě od hlídky */
let AC = null, tCnt = 0;
function beep(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach(d => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.0001, AC.currentTime + d); g.gain.exponentialRampToValueAtTime(.25, AC.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d + .15);
      o.start(AC.currentTime + d); o.stop(AC.currentTime + d + .16); }); } catch (e){}
}
function ping(){ if (zvuk) beep(); if (document.visibilityState !== "visible" || !document.hasFocus()){ tCnt++; document.title = `(${tCnt}) Dozorčí služba`; } }
window.addEventListener("focus", () => { tCnt = 0; document.title = "Dozorčí služba – MP Blansko"; });

/* ---------- mapa (Mapy.com) ---------- */
let MAP = null, LAYER = null;
try {
  if (window.L){
    MAP = L.map("map", {zoomControl:true, attributionControl:true}).setView(BLANSKO, 14);
    L.tileLayer(`https://api.mapy.cz/v1/maptiles/basic/256/{z}/{x}/{y}?apikey=${MAPY_KEY}`, {minZoom:0, maxZoom:19,
      attribution:'<a href="https://api.mapy.com/copyright" target="_blank" rel="noopener">&copy; Seznam.cz a.s. a další</a>'}).addTo(MAP);
    LAYER = L.layerGroup().addTo(MAP);
  } else $("nomap").hidden = false;
} catch (e){ $("nomap").hidden = false; }
function drawMap(){
  if (!MAP) return;
  LAYER.clearLayers();
  const pts = [];
  MSGS.filter(m => !m.smazano && m.adresa && m.adresa.lat != null).forEach(m => {
    const a = m.adresa, oz = m.oznameni, cls = oz ? (m.vyrizeno ? "done" : "") : "adr";
    const lbl = `${m.at ? hm(ms(m.at)) : ""} · ${oz ? esc(oz.druh) + " – " : ""}${esc(String(a.adresa).replace(/, Blansko$/, ""))}`;
    const mk = L.marker([a.lat, a.lon], {icon:L.divIcon({className:"", html:`<div class="mk ${cls}"><b>${lbl}</b><i></i></div>`, iconSize:[0, 0]}), zIndexOffset:oz && !m.vyrizeno ? 1000 : 0});
    mk.on("click", () => { const el = document.querySelector(`.m[data-mid="${m.id}"]`); if (el){ el.scrollIntoView({block:"center", behavior:"smooth"}); el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 1800); } });
    mk.addTo(LAYER); pts.push([a.lat, a.lon]);
  });
  if (pts.length === 1) MAP.setView(pts[0], 15); else if (pts.length > 1) MAP.fitBounds(pts, {padding:[60, 60], maxZoom:16});
}

/* ---------- formulář oznámení ---------- */
$("druhy").innerHTML = DRUHY.map((d, i) => `<button type="button" data-dr="${esc(d)}">${esc(d)}<kbd>F${i + 1}</kbd></button>`).join("");
$("patro").innerHTML = PATRA.map(p => `<option value="${esc(p)}">${p || "—"}</option>`).join("");
const setDruh = d => { druh = druh === d ? "" : d; document.querySelectorAll("[data-dr]").forEach(b => b.classList.toggle("on", b.dataset.dr === druh)); pv(); };
$("druhy").addEventListener("click", e => { const b = e.target.closest("[data-dr]"); if (b) setDruh(b.dataset.dr); });
let sugItems = [], sugI = -1, sugCtl = null, sugT = null, geo = null, geoCtl = null, geoT = null;
const api = (q, type, signal) => fetch(`https://api.mapy.cz/v1/suggest?lang=cs&limit=10${type}&locality=${encodeURIComponent("BOX(16.52,49.30,16.78,49.45)")}&query=${encodeURIComponent(q)}&apikey=${MAPY_KEY}`, {signal}).then(r => r.ok ? r.json() : Promise.reject(r.status));
function drawSug(){
  const s = $("sug"); s.hidden = !sugItems.length;
  s.innerHTML = sugItems.map((x, i) => `<button type="button" class="${i === sugI ? "on" : ""}" data-si="${i}">${esc(x.name)}<small>${esc(x.location || "")}</small></button>`).join("");
}
$("ul").addEventListener("input", () => {
  geo = null; pv(); clearTimeout(sugT); clearTimeout(geoT); geoT = setTimeout(geoLook, 500);
  sugT = setTimeout(() => {
    const v = $("ul").value.trim(); if (sugCtl) sugCtl.abort(); if (v.length < 2){ sugItems = []; drawSug(); return; }
    sugCtl = new AbortController();
    api(v, "&type=regional.street&type=regional.municipality_part", sugCtl.signal).then(j => { sugItems = (j.items || []).slice(0, 7).map(x => ({name:x.name, location:x.location})); sugI = sugItems.length ? 0 : -1; drawSug(); })
      .catch(e => { if (e && e.name === "AbortError") return; sugItems = []; drawSug(); });
  }, 200);
});
const pickSug = i => { const x = sugItems[i]; if (!x) return; $("ul").value = x.name; sugItems = []; drawSug(); $("cp").focus(); geoLook(); };
$("ul").addEventListener("keydown", e => {
  if (!sugItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); sugI = (sugI + (e.key === "ArrowDown" ? 1 : -1) + sugItems.length) % sugItems.length; drawSug(); }
  else if ((e.key === "Enter" || e.key === "Tab") && sugI >= 0 && !e.ctrlKey){ e.preventDefault(); pickSug(sugI); }
});
$("ul").addEventListener("blur", () => setTimeout(() => { sugItems = []; drawSug(); }, 150));
$("sug").addEventListener("mousedown", e => { const b = e.target.closest("[data-si]"); if (b){ e.preventDefault(); pickSug(+b.dataset.si); } });
["cp", "patro", "byt", "ozn", "tel", "popis"].forEach(id => $(id).addEventListener("input", () => { if (id === "cp"){ geo = null; clearTimeout(geoT); geoT = setTimeout(geoLook, 400); } pv(); }));
$("patro").addEventListener("change", pv);
const adrTxt = () => { const u = $("ul").value.trim().replace(/,?\s*blansko\s*$/i, ""), c = $("cp").value.trim(); return u ? `${u}${c ? " " + c : ""}, Blansko` : ""; };
function geoLook(){
  geo = null; if (geoCtl) geoCtl.abort(); pv();
  const u = $("ul").value.trim().replace(/,?\s*blansko\s*$/i, ""), c = $("cp").value.trim(); if (!u || !c) return;
  geoCtl = new AbortController();
  api(`${u} ${c}`, "&type=regional.address", geoCtl.signal).then(j => {
    const cn = c.toLowerCase().split("/")[0], it = (j.items || []).find(x => x.name.toLowerCase().split(/[\s/]+/).includes(cn)) || (j.items || [])[0];
    geo = it && it.position ? {lat:it.position.lat, lon:it.position.lon, name:it.name} : null; pv();
  }).catch(() => {});
}
function pv(){
  const a = adrTxt(), p = $("patro").value;
  $("pv").innerHTML = a || druh ? `${druh ? `<b>${esc(druh)}</b>` : ""}${a ? `${druh ? " · " : ""}<b>${esc(a)}</b>${p ? " · " + esc(p) : ""} ${geo ? `<span class="ok">✓ na mapě</span>` : $("cp").value.trim() ? "· hledám na mapě…" : ""}` : ""}` : "";
  $("err").hidden = true;
}
function clearForm(){ ["ul", "cp", "byt", "ozn", "tel", "popis"].forEach(id => { $(id).value = ""; }); $("patro").value = ""; druh = ""; geo = null; setDruh(""); pv(); $("ul").focus(); }
$("vymazat").addEventListener("click", clearForm);
async function sendOzn(){
  const t = SEL && TH[SEL]; if (!t) return;
  const a = adrTxt(), popis = $("popis").value.trim();
  if (!druh && !a && !popis){ $("err").textContent = "Vyplň aspoň druh oznámení, adresu nebo popis."; $("err").hidden = false; return; }
  if (a && !$("cp").value.trim() && !confirm("Adresa je bez čísla popisného. Odeslat i tak?")) return;
  const data = {text:popis.slice(0, 2000), oznameni:{druh:druh || "Oznámení"}};
  if ($("ozn").value.trim()) data.oznameni.oznamovatel = $("ozn").value.trim();
  if ($("tel").value.trim()) data.oznameni.telefon = $("tel").value.trim();
  if ($("byt").value.trim()) data.oznameni.byt = $("byt").value.trim();
  if (a){ data.adresa = {adresa:a}; if ($("patro").value) data.adresa.patro = $("patro").value; if (geo){ data.adresa.lat = geo.lat; data.adresa.lon = geo.lon; } }
  const prev = `🚨 ${data.oznameni.druh}${a ? " – " + a.replace(/, Blansko$/, "") : ""}${popis ? " – " + popis : ""}`;
  $("odeslat").disabled = true;
  try { await write(data, prev); clearForm(); toast("Oznámení odesláno hlídce."); }
  catch (e){ $("err").textContent = e.code === "permission-denied" ? "Odeslání zamítnuto pravidly Firestore." : "Oznámení se nepodařilo odeslat."; $("err").hidden = false; }
  finally { drawState(); }
}
$("odeslat").addEventListener("click", sendOzn);
document.addEventListener("keydown", e => {
  if (!$("gate").hidden) return;
  if (e.ctrlKey && e.key === "Enter" && e.target.id !== "chT"){ e.preventDefault(); sendOzn(); return; }
  const f = /^F(\d)$/.exec(e.key); if (f && DRUHY[+f[1] - 1]){ e.preventDefault(); setDruh(DRUHY[+f[1] - 1]); return; }
  if (e.key === "Escape" && document.activeElement && document.activeElement.closest(".form")){ e.preventDefault(); clearForm(); }
});
</script>
</body>
</html>
